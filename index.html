<!DOCTYPE html>
<html lang="de" style="background:#0d0d0d;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; connect-src 'self' ipc: http://ipc.localhost http://localhost:9847 http://127.0.0.1:9847 http://127.0.0.1:8888 https://translate.googleapis.com https://api.github.com https://raw.githubusercontent.com https://kodama-stats.kiyoshidesign.workers.dev; img-src 'self' data: blob: http://localhost:9847 http://127.0.0.1:9847; media-src 'self' file: blob: https:; font-src 'self' tauri: data: https://fonts.gstatic.com; frame-src http://localhost:* https://composer.kiyoshi.dev" />
    <title>Kodama</title>
    <!-- No inline style or script elements in this file: see public/boot.js for why. -->
    <link rel="stylesheet" href="/boot.css" />

    <!-- Local FontAwesome — synchronous load (embedded in binary, no latency penalty) -->
    <link rel="stylesheet" href="/css/all.min.css" />

    <!-- Google Fonts — non-blocking, never block first paint -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&family=Inter:wght@400;700&family=Roboto:wght@400;700&family=Nunito:wght@400;700&family=Exo+2:wght@400;700&family=Poppins:wght@400;700&family=Raleway:wght@400;700&family=Montserrat:wght@400;700&family=DM+Sans:opsz,wght@9..40,400;9..40,700&family=Ubuntu:wght@400;700&family=Lexend:wght@400;700&family=Space+Grotesk:wght@400;700&family=Sora:wght@400;700&family=Barlow:wght@400;700&family=Figtree:wght@400;700&family=Plus+Jakarta+Sans:wght@400;700&family=Kanit:wght@400;700&family=Oxanium:wght@400;700&family=Chakra+Petch:wght@400;700&display=swap" />
  </head>
  <body>
    <!-- HTML-level boot splash. Stays visible until React mounts and fades it out. -->
    <div id="boot-splash"><img class="boot-logo" src="/Kodama%20Logo.png" alt="Kodama" /></div>
    <div id="root"></div>
    <script src="/boot.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
