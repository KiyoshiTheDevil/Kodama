name = "kodama-stats"
main = "worker.js"
compatibility_date = "2025-01-01"

# Anonymous active-user counter. See README.md.
# Create the KV namespace once, then paste its id below:
#   npx wrangler kv namespace create STATS
[[kv_namespaces]]
binding = "STATS"
id = "adba41b3fa9841d4a6182c84d6355628"

# Daily snapshot of the GitHub download totals + rescue of the previous month's counter.
# 03:10 UTC — after midnight rollover, and off the top of the hour where Cloudflare queues
# the most scheduled work.
[triggers]
crons = ["10 3 * * *"]

# Store ratings: one row per (entry, voter token). D1 rather than KV because a changed rating has
# to leave the average in the same step it enters it. Schema: ratings-schema.sql
[[d1_databases]]
binding = "RATINGS"
database_name = "kodama-ratings"
database_id = "04fbcf7c-3bd4-45a7-aac9-cdddfa4b6a70"
