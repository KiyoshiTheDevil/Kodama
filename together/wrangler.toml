name = "kodama-together"
main = "worker.js"
compatibility_date = "2025-01-01"

# ListenTogether rooms. One Durable Object per room holds its WebSockets and its state. See
# README.md. SQLite-backed, which is what the Workers free plan offers.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
